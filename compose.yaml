services:
  api:
    build: ./backend
    container_name: dunja-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data:Z
    expose:
      - "5000"

  web:
    image: docker.io/library/nginx:1.27-alpine
    container_name: dunja-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,Z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
