# Cloudflare provides the visitor IP in CF-Connecting-IP. Fall back to the
# direct peer address when the site is not behind Cloudflare.
map $http_cf_connecting_ip $login_rate_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $login_rate_key zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /api/auth/google {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /uploads/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /admin { return 301 /admin/; }
    location / {
        try_files $uri $uri/ =404;
    }
}
